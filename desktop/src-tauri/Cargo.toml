[package]
name = "app"
version = "0.1.1"
description = "Real-time 2D/3D satellite tracking, orbital propagation, and offline AI discovery"
authors = ["Sethu Srinivasan"]
license = "MIT"
repository = "https://github.com/sethusrinivasan/satellite-tracker"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
