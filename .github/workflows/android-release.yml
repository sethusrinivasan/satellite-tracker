name: Build Android App & Store Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src-tauri/gen/android/**'
      - 'src-tauri/**'
      - 'app/static/**'
      - 'scripts/**'
      - 'fastlane/**'
      - 'dist-store/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'src-tauri/gen/android/**'
      - 'src-tauri/**'
      - 'app/static/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Publish packages to GitHub Release if tag exists'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android AAB & APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "platforms;android-37" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Setup Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Setup Python & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Store Submission Assets
        run: |
          python -m pip install --upgrade pip pillow
          python scripts/generate_store_assets.py

      - name: Configure Keystore & Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            echo "Using production signing keystore from GitHub Secrets"
          else
            echo "Generating self-signed release keystore for CI builds"
            keytool -genkey -v -keystore keystore/release.keystore -alias satellitetracker \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "androidstorepass" -keypass "androidkeypass" \
              -dname "CN=Sethu Srinivasan, O=SatTrack, C=US"
            echo "KEYSTORE_PASSWORD=androidstorepass" >> $GITHUB_ENV
            echo "KEY_ALIAS=satellitetracker" >> $GITHUB_ENV
            echo "KEY_PASSWORD=androidkeypass" >> $GITHUB_ENV
          fi

      - name: Build Google Play Android App Bundle (.aab)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          export ANDROID_NDK_ROOT=$NDK_HOME
          export ANDROID_NDK_HOME=$NDK_HOME
          echo "Building Google Play Store Android App Bundle (.aab)..."
          if npx tauri android build --apk=false --aab=true; then
            echo "Tauri AAB build successful."
          else
            echo "Falling back to direct Gradle bundleRelease invocation..."
            cd src-tauri/gen/android
            ./gradlew :app:bundleRelease --no-daemon
            cd ../../../
          fi

      - name: Build Amazon Appstore Universal APK (.apk)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          export ANDROID_NDK_ROOT=$NDK_HOME
          export ANDROID_NDK_HOME=$NDK_HOME
          echo "Building Amazon Appstore Universal Release APK (.apk)..."
          if npx tauri android build --apk=true --aab=false; then
            echo "Tauri APK build successful."
          else
            echo "Falling back to direct Gradle assembleRelease invocation..."
            cd src-tauri/gen/android
            ./gradlew :app:assembleRelease --no-daemon
            cd ../../../
          fi

      - name: Assemble Store Submission Packages & Metadata
        run: |
          mkdir -p dist-android-store/google-play
          mkdir -p dist-android-store/amazon-appstore
          mkdir -p dist-android-store/docs

          # 1. Locate and copy .aab for Google Play
          AAB_FILE=$(find src-tauri/gen/android -name "*release*.aab" | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            cp "$AAB_FILE" dist-android-store/google-play/app-release.aab
            echo "Found Play Store bundle: $AAB_FILE"
          else
            echo "Warning: AAB file not found at expected gradle path; checking alternate paths"
            find src-tauri/gen/android -name "*.aab" -exec cp {} dist-android-store/google-play/app-release.aab \;
          fi

          # 2. Locate and copy ProGuard mapping file
          MAPPING_FILE=$(find src-tauri/gen/android -name "mapping.txt" | head -n 1)
          if [ -f "$MAPPING_FILE" ]; then
            cp "$MAPPING_FILE" dist-android-store/google-play/mapping.txt
            echo "Found ProGuard mapping: $MAPPING_FILE"
          fi

          # 3. Copy Google Play store listing metadata & graphics
          cp -r fastlane/metadata/android/ dist-android-store/google-play/metadata/

          # 4. Locate and copy Universal .apk for Amazon Appstore
          APK_FILE=$(find src-tauri/gen/android -name "*release*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" dist-android-store/amazon-appstore/app-release-universal.apk
            echo "Found Amazon Appstore APK: $APK_FILE"
          else
            echo "Warning: APK file not found at expected gradle path; checking alternate paths"
            find src-tauri/gen/android -name "*.apk" -exec cp {} dist-android-store/amazon-appstore/app-release-universal.apk \;
          fi

          # 5. Copy Amazon Appstore listing metadata & graphics
          cp -r dist-store/amazon/* dist-android-store/amazon-appstore/

          # 6. Documentation & guides
          cp docs/store-submission/STORE_SUBMISSION_GUIDE.md dist-android-store/docs/
          cp docs/PRIVACY_POLICY.md dist-android-store/docs/

          # 7. Checksums
          cd dist-android-store
          find . -type f \( -name "*.aab" -o -name "*.apk" -o -name "*.png" -o -name "*.txt" -o -name "*.json" \) -exec sha256sum {} + > SHA256SUMS.txt
          cd ..

          # 8. Create compressed store bundle zip
          zip -r satellite-tracker-android-store-bundle.zip dist-android-store/

      - name: Upload Store Submission Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: satellite-tracker-android-submission-bundle
          path: |
            dist-android-store/
            satellite-tracker-android-store-bundle.zip
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.upload_to_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-android-store/google-play/app-release.aab
            dist-android-store/amazon-appstore/app-release-universal.apk
            satellite-tracker-android-store-bundle.zip
          draft: false
          prerelease: false
          generate_release_notes: true
