name: Build and Publish Container Image

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:
  test:
    name: Sanity tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pytest
        run: python -m pytest -q

  build-and-push:
    name: Build & Push Container Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate version and detect version bump
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must contain a semantic version (for example, 1.2.3)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          previous="$(git show HEAD^:VERSION 2>/dev/null | tr -d '[:space:]' || true)"
          if [[ -z "$previous" ]]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No previous VERSION found; the image will only be built."
          elif [[ ! "$previous" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The previous VERSION is not a semantic version."
            exit 1
          elif [[ "$version" == "$previous" ]]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "VERSION was not bumped; the image will only be built."
          elif [[ "$(printf '%s\n' "$previous" "$version" | sort -V | tail -n1)" != "$version" ]]; then
            echo "::error::VERSION must be greater than the previous version ($previous)."
            exit 1
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "VERSION bumped from $previous to $version; publishing is enabled."
          fi

      - name: Check Docker Hub credentials
        id: check_secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub secrets are not configured; container publication will be limited to GHCR."
          fi

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request' && steps.version.outputs.bumped == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.version.outputs.bumped == 'true' && steps.check_secrets.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/satellite-tracker', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && steps.version.outputs.bumped == 'true' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && steps.version.outputs.bumped == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
