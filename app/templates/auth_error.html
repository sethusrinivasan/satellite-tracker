{% extends "base.html" %}
{% block title %}{{ title }} — SatTrack{% endblock %}

{% block content %}
<section class="section">
  <div class="container--narrow" style="text-align:center;padding-top:80px;">
    <div style="font-size:3.5rem;margin-bottom:20px;">⚙️</div>
    <h1 class="page-title" style="color:var(--warning);">{{ title }}</h1>
    <p style="color:var(--text-sub);max-width:480px;margin:16px auto 32px;line-height:1.7;">
      {{ message }}
    </p>
    <a href="{{ url_for('upload.index') }}" class="btn btn--secondary">← Back to Home</a>
  </div>
</section>
{% endblock %}
