{% extends "base.html" %}
{% block title %}Admin — SatTrack{% endblock %}

{% block content %}
<section class="section">
  <div class="container--narrow" style="text-align:center;padding-top:72px;max-width:400px;margin:0 auto;">
    <h1 class="page-title">Admin</h1>
    <p style="color:var(--text-muted);margin:12px 0 24px;line-height:1.5;">
      {{ message or "Google sign-in is not set up on this copy." }}
    </p>
    {% if is_local_dev %}
    <a href="{{ url_for('auth.dev_bypass') }}" id="local-admin-continue-btn" class="btn btn--primary" style="margin-bottom:12px;">
      Continue to Admin
    </a>
    <p style="font-size:0.78rem;color:var(--warning);margin-bottom:20px;">Local only. This skip is not used in production.</p>
    {% endif %}
    <a href="{{ url_for('upload.index') }}" class="btn btn--secondary">← Back</a>
  </div>
</section>
{% endblock %}
